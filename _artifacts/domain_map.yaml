coverage:
  ignored_packages:
    - docs
    - examples/*
    - next
    - tanstack-start
    - nuxt
    - astro
    - react-router

failure_modes:
  - mistake: 'Using v3 { action, dataType } schema shape'
    impact: 'Type errors and wrong check paths after upgrading to v4'
    correct_pattern: |
      post: ['read', { name: 'update', type: Post }]
    source: 'letstri/permix:docs/content/docs/migration-v3-to-v4.mdx'
    priority: CRITICAL
    status: active
    version_context: 'Permix v4 uses action tuples; agents trained on v3 docs still emit objects'
    skills: [permix-getting-started]

  - mistake: 'Checking permissions before setup completes'
    impact: 'PermixNotReadyError or false negatives in UI'
    correct_pattern: |
      await permix.isReadyAsync()
      if (check('post.read')) { ... }
    source: 'letstri/permix:docs/content/docs/guide/ready.mdx'
    priority: HIGH
    status: active
    skills: [permix]

  - mistake: 'Relying on dehydrate alone for dynamic rules'
    impact: 'Function-based ReBAC checks wrong after SSR hydrate'
    correct_pattern: |
      permix.hydrate(state)
      permix.setup(clientRulesForUser)
    source: 'letstri/permix:docs/content/docs/guide/hydration.mdx'
    priority: CRITICAL
    status: active
    skills: [permix]

  - mistake: 'Client-only authorization without server middleware'
    impact: 'Security bypass; attackers can call APIs directly'
    correct_pattern: |
      app.use(permix.setupMiddleware(rules))
      app.post('/posts', permix.checkMiddleware('post.create'), handler)
    source: 'letstri/permix:docs/content/docs/integrations/express.mdx'
    priority: CRITICAL
    status: active
    skills: [permix]

  - mistake: 'Treating app-layer checks as database enforcement'
    impact: 'Browser-reachable tables leak rows; stale JWTs keep old claims'
    correct_pattern: |
      Enable RLS on every browser-accessible table; resolveRules from verified identity; refresh tokens before trusting JWT authorization claims.
    source: 'letstri/permix:docs/content/docs/guide/security.mdx'
    priority: CRITICAL
    status: active
    skills: [permix]
