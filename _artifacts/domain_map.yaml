# domain_map.yaml
# Library: Permix
# Version: 4.1.2

library:
  name: permix
  version: '4.1.2'
  repository: 'https://github.com/letstri/permix'
  description: >
    Lightweight, framework-agnostic, type-safe permissions for JavaScript apps.
    Define a schema with createPermix, assign rules with setup, check with
    dot-path strings, and integrate via React/Vue/Solid/Svelte and server adapters.
  primary_framework: framework-agnostic

domains:
  - name: 'Core setup'
    slug: core-setup
    description: >
      Schema definition, setup, templates, createRules, events, and migration
      from Permix v3 to v4.

  - name: 'Authorization checks'
    slug: authorization
    description: >
      check() paths, callbacks, ~all/~any aggregates, ReBAC/ABAC entity rules,
      and readiness (isReady).

  - name: 'Frontend integration'
    slug: frontend
    description: >
      Provider, hooks, and declarative components for React, Vue, Solid, and Svelte.

  - name: 'Server integration'
    slug: server
    description: >
      Per-request setupMiddleware and checkMiddleware for Express, Hono, Fastify,
      NestJS, tRPC, oRPC, Node, Elysia, and Astro; provider identity adapters
      and fetch-standard policy decision points.

  - name: 'SSR and hydration'
    slug: ssr
    description: >
      dehydrate/hydrate snapshots, PermixHydrate, Next.js, TanStack Start, Nuxt,
      and React Router wiring.

skills:
  - name: 'Getting started'
    slug: permix-getting-started
    domain: core-setup
    description: >
      Install permix, define createPermix schema, call setup, use template and
      createRules for role presets.
    type: core
    packages:
      - permix
    covers:
      - createPermix
      - setup
      - template
      - createRules
      - hook / hookOnce
    tasks:
      - 'Add Permix to a new application'
      - 'Define permission schema and role templates'
      - 'Migrate from Permix v3 action objects to v4 tuples'
    sources:
      - 'letstri/permix:docs/content/docs/quick-start.mdx'
      - 'letstri/permix:docs/content/docs/guide/setup.mdx'
      - 'letstri/permix:docs/content/docs/guide/template.mdx'
      - 'letstri/permix:docs/content/docs/guide/instance.mdx'
      - 'letstri/permix:docs/content/docs/guide/events.mdx'
      - 'letstri/permix:docs/content/docs/migration-v3-to-v4.mdx'
      - 'letstri/permix:docs/content/docs/integrations/standard-schema.mdx'
      - 'letstri/permix:permix/src/core/index.ts'

  - name: 'Permix (check, frontend, server)'
    slug: permix
    domain: authorization
    description: >
      Everything past initial setup. SKILL.md is a workflow with invariants and
      a verify checklist. Per-adapter references cover check/ReBAC, UI, SSR,
      HTTP/RPC, Nest, Drizzle, Effect, Standard Schema, catalog extraction, HTTP
      PDP, and provider identity (Supabase, Better Auth, Clerk, Convex).
    type: core
    packages:
      - permix
    subsystems:
      - react
      - vue
      - solid
      - svelte
      - next
      - tanstack-start
      - nuxt
      - react-router
      - express
      - hono
      - fastify
      - nest
      - trpc
      - orpc
      - node
      - elysia
      - astro
      - extractor
      - drizzle
      - effect
      - adapter
      - pdp
      - supabase
      - better-auth
      - clerk
      - convex
    covers:
      - check
      - isReady
      - ReBAC closures
      - "'~all' / '~any'"
      - PermixProvider
      - usePermix
      - createComponents
      - Check component
      - dehydrate
      - hydrate
      - PermixHydrate
      - setupMiddleware
      - checkMiddleware
      - getOrThrow
      - permission extraction
      - provider identity adapters
      - HTTP PDP and client
    tasks:
      - 'Gate UI or API logic with permix.check'
      - 'Implement resource-level authorization with entity data'
      - 'Wrap the app tree and hide actions based on permissions'
      - 'Integrate permix/react, permix/vue, permix/solid, or permix/svelte'
      - 'Pass permission booleans from server render to client'
      - 'Wire permix/next, permix/tanstack-start, permix/nuxt, or permix/react-router'
      - 'Protect HTTP or RPC routes on the server'
      - 'Derive rules from authenticated request context'
      - 'Generate typed permission catalogs from source markers'
      - 'Resolve per-request rules from Supabase, Better Auth, Clerk, or Convex'
