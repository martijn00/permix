packages:
  - permix
  - docs
  - examples/*
allowBuilds:
  better-sqlite3: true
  esbuild: false
  sharp: false
catalog:
  '@types/node': ^26.4.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitejs/plugin-react': ^6.1.0
  oxfmt: ^0.65.0
  oxlint: ^1.80.0
  oxlint-tsgolint: ^7.0.2001
  react: ^19.2.8
  react-dom: ^19.2.8
  tsx: ^4.23.12
  turbo: 2.10.12
  typescript: 7.0.2
  ultracite: ^7.10.7
  vite: ^8.2.2
  vitest: ^4.1.11
catalogs:
  typescript-classic:
    typescript59: npm:typescript@5.9.3
    typescript6: npm:@typescript/typescript6@6.0.2
catalogMode: strict
saveWorkspaceProtocol: rolling
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    typescript: '*'
    drizzle-orm>effect: '*'
publicHoistPattern:
  - '@typescript/*'
shellEmulator: true
