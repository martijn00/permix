packages:
  - permix
  - docs
  - examples/*
allowBuilds:
  better-sqlite3: true
  esbuild: false
  sharp: false
catalog:
  '@types/node': ^25.9.1
  '@types/react': ^19.2.15
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.2
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  oxlint-tsgolint: ^7.0.2001
  react: ^19.2.6
  react-dom: ^19.2.6
  tsx: ^4.22.4
  turbo: 2.10.12
  typescript: 7.0.2
  ultracite: ^7.10.6
  vite: ^8.0.16
  vitest: ^4.1.8
catalogs:
  typescript-classic:
    typescript59: npm:typescript@5.9.3
    typescript6: npm:@typescript/typescript6@6.0.2
catalogMode: strict
saveWorkspaceProtocol: rolling
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    typescript: '*'
    drizzle-orm>effect: '*'
publicHoistPattern:
  - '@typescript/*'
shellEmulator: true
