name: Feature request
description: Propose a DX, API, or adapter improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Add a typed helper for checking several permissions at once
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or maintenance pain does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep this focused on implementation shape, not product marketing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues and docs first
          required: true
